<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  focusable="false"
  [attr.aria-hidden]="label() ? null : true"
  [attr.aria-label]="label() ?? null"
  [attr.role]="label() ? 'img' : null"
>
  <path *ngFor="let path of icons[name()]" [attr.d]="path" />
</svg>
